[workspace]
members = ["crates/bots-core"]

[package]
name = "mq2-bots"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "MQ2Bots"         # becomes MQ2Bots.dll
crate-type = ["cdylib"]
test = false             # a plugin links MacroQuest, so a test binary can't start outside the game
doctest = false

[dependencies]
mq-emu = { git = "https://github.com/dotsyzygy/mq-emu-rs", tag = "v0.2.1" }
bots-core = { path = "crates/bots-core" }
# Posse's crates aren't published, so they come from the repo next to this one.
posse-core = { path = "../mq2-posse-rs/crates/posse-core" }
posse-shm = { path = "../mq2-posse-rs/crates/posse-shm" }
