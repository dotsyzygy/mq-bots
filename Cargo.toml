[workspace]
members = ["crates/bots-core"]

[package]
name = "mq2-bots"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "MQ2Bots"         # becomes MQ2Bots.dll
crate-type = ["cdylib"]
test = false             # a plugin links MacroQuest, so a test binary can't start outside the game
doctest = false

[dependencies]
mq-emu = { git = "https://github.com/dotsyzygy/mq-emu-rs", tag = "v0.1.6" }
bots-core = { path = "crates/bots-core" }
